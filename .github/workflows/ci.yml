name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: swissarmyhammer/workflows/.github/workflows/swift-ci.yaml@main
    with:
      integration-package-path: IntegrationTests
      # Each name is one leg of the examples job. Each leg runs
      # `./Scripts/test-examples.sh <name>`, which builds the SwiftPM executable target of
      # that name. Scripts/test-examples.sh names the same set.
      examples: '["CodeContextExample", "ManagerExample"]'
